name: Gerar AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Instalar dependencias
        run: |
          ls -la
          if [ -f package.json ]; then
            npm install
          elif [ -f ai-hub-playstore/package.json ]; then
            cd ai-hub-playstore && npm install && cd ..
          else
            find . -type f -name "package.json" | head -20
            npm install --prefix $(dirname $(find . -name "package.json" | head -1))
          fi
      - name: Gerar AAB
        run: |
          if [ -f package.json ]; then
            npx expo prebuild --platform android --clean
            cd android && ./gradlew bundleRelease
          else
            PKG_DIR=$(dirname $(find . -name "package.json" | head -1))
            cd $PKG_DIR
            npx expo prebuild --platform android --clean
            cd android && ./gradlew bundleRelease
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: meu-app-aab
          path: |
            **/android/app/build/outputs/bundle/release/app-release.aab
